name: Deploy GitHub Pages
on:
  push:
    branches: [gh-pages]
permissions:
  pages: write
  contents: read
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - uses: actions/upload-pages-artifact@v3
      - uses: actions/deploy-pages@v4
